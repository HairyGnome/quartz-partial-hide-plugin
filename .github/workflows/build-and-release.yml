name: Build and Release

"on":
  pull_request:
    branches: [prod]
  push:
    branches: [prod]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Install dependencies
        run: npm ci
      - name: Run static checks
        run: |
          npm run typecheck
          npm run lint
          npm run format
      - name: Run unit tests
        run: npm run test

  build:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Install dependencies
        run: npm ci
      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"
      - name: Build project
        run: npm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  build-with-skill:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Install dependencies
        run: npm ci
      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"
      - name: Build project
        run: npm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-ai
          path: dist

  release:
  runs-on: ubuntu-latest
  needs: build
  env:
    VERSION: ${{ needs.build.outputs.version }}
    GH_TOKEN: ${{ github.token }}
  steps:
    - name: Download dist
      uses: actions/download-artifact@v4
      with:
        name: plugin-dist
        path: dist/

    - name: Publish compiled plugin
      shell: bash
      run: |
        set -e

        # Validate version
        if [ -z "$VERSION" ]; then
          echo "ERROR: Version is empty!"
          exit 1
        fi

        TAG="v$VERSION"
        echo "Publishing $TAG"

        # Preserve build output outside the Git repository
        mkdir -p /tmp/plugin-release
        cp -a dist/. /tmp/plugin-release/

        # Initialize clean repository
        git init -b release
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

        # Check whether this version already exists
        EXISTING_TAG=$(git ls-remote --tags origin "refs/tags/$TAG")

        if [ -n "$EXISTING_TAG" ]; then
          echo "ERROR: $TAG already exists!"
          exit 1
        fi

        # Put compiled files directly in repository root
        cp -a /tmp/plugin-release/. .

        git add -A
        git commit -m "Release $TAG"

        # Update compiled branch
        git push origin HEAD:refs/heads/release --force

        # Create immutable version tag
        git tag -a "$TAG" -m "Release $TAG"
        git push origin "$TAG"

    - name: Create GitHub Release
      run: |
        gh release create "v$VERSION" \
          --title "v$VERSION" \
          --generate-notes

  release-with-skill:
  runs-on: ubuntu-latest
  needs: build-with-skill

  permissions:
    contents: write

  steps:
    - name: Download AI build
      uses: actions/download-artifact@v4
      with:
        name: dist-ai
        path: dist/

    - name: Publish AI build
      shell: bash
      env:
        VERSION: ${{ needs.build-with-skill.outputs.version }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -e

        if [ -z "$VERSION" ]; then
          echo "ERROR: Version is empty!"
          exit 1
        fi

        TAG="v$VERSION-ai"

        mkdir -p /tmp/plugin-release
        cp -a dist/. /tmp/plugin-release/

        git init -b release
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

        EXISTING_TAG=$(git ls-remote --tags origin "refs/tags/$TAG")
        if [ -n "$EXISTING_TAG" ]; then
          echo "ERROR: $TAG already exists!"
          exit 1
        fi

        cp -a /tmp/plugin-release/. .
        git add -A
        git commit -m "Release $TAG"

        git push origin HEAD:refs/heads/release --force

        git tag -a "$TAG" -m "Release $TAG"
        git push origin "$TAG"

    - name: Create GitHub Release
      env:
        VERSION: ${{ needs.build-with-skill.outputs.version }}
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "v$VERSION-ai" \
          --title "v$VERSION AI" \
          --generate-notes
