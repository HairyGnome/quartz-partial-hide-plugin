name: Build and Release

"on":
  pull_request:
    branches: [prod]
  push:
    branches: [prod]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Run static checks
        run: |
          npm run typecheck
          npm run lint
          npm run format

      - name: Run unit tests
        run: npm run test

  build:
    needs: [test]
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Build project
        run: npm run build

      - name: Prepare plugin package
        run: |
          set -e
          test -d dist
          mkdir -p release-package
          cp package.json release-package/
          cp -a dist release-package/dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-normal
          path: release-package/
          if-no-files-found: error

  build-with-skill:
    needs: [test]
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Build project with agent skill
        run: npm run build-with-skill

      - name: Prepare AI plugin package
        run: |
          set -e
          test -d dist
          mkdir -p release-package
          cp package.json release-package/
          cp -a dist release-package/dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-ai
          path: release-package/
          if-no-files-found: error

  release:
    needs: [build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Download plugin package
        uses: actions/download-artifact@v4
        with:
          name: plugin-normal
          path: release-package

      - name: Publish normal release
        env:
          VERSION: ${{ needs.build.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          TAG="v$VERSION"

          if [ -z "$VERSION" ]; then
            echo "ERROR: Version is empty!"
            exit 1
          fi

          cd release-package

          git init -b release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "ERROR: Tag $TAG already exists!"
            exit 1
          fi

          git add -A
          git commit -m "Release $TAG"

          git push origin HEAD:refs/heads/release --force

          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

  release-with-skill:
    needs: [build-with-skill, release]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Download AI plugin package
        uses: actions/download-artifact@v4
        with:
          name: plugin-ai
          path: release-package

      - name: Publish AI release
        env:
          VERSION: ${{ needs.build-with-skill.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          TAG="v$VERSION-ai"

          if [ -z "$VERSION" ]; then
            echo "ERROR: Version is empty!"
            exit 1
          fi

          cd release-package

          git init -b release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "ERROR: Tag $TAG already exists!"
            exit 1
          fi

          git add -A
          git commit -m "Release $TAG"

          git push origin HEAD:refs/heads/release --force

          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
