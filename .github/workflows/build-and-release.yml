name: Build and Release

"on":
  pull_request:
    branches: [prod]
  push:
    branches: [prod]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Run static checks
        run: |
          npm run typecheck
          npm run lint
          npm run format

      - name: Run unit tests
        run: npm run test

  build:
    needs: [test]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  build-with-skill:
    needs: [test]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Build project with agent skill
        run: npm run build-with-skill

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-ai
          path: dist-ai

  release:
    needs: [build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Prepare release branch
        env:
          VERSION: ${{ needs.build.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          if [ -z "$VERSION" ]; then
            echo "ERROR: Version is empty!"
            exit 1
          fi

          TAG="v$VERSION"

          mkdir -p /tmp/release
          cp -a dist/. /tmp/release/

          git init -b release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "ERROR: Version $TAG already exists!"
            exit 1
          fi

          cp -a /tmp/release/. .

          git add -A
          git commit -m "Release $TAG"

          git push origin HEAD:refs/heads/release --force

          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          VERSION: ${{ needs.build.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes

  release-with-skill:
    needs: [build-with-skill, release]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Download dist-ai
        uses: actions/download-artifact@v4
        with:
          name: dist-ai
          path: dist-ai

      - name: Prepare release branch
        env:
          VERSION: ${{ needs.build-with-skill.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          if [ -z "$VERSION" ]; then
            echo "ERROR: Version is empty!"
            exit 1
          fi

          TAG="v$VERSION-ai"

          mkdir -p /tmp/release
          cp -a dist-ai/. /tmp/release/

          git init -b release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "ERROR: Version $TAG already exists!"
            exit 1
          fi

          cp -a /tmp/release/. .

          git add -A
          git commit -m "Release $TAG"

          git push origin HEAD:refs/heads/release --force

          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          VERSION: ${{ needs.build-with-skill.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION-ai" \
            --title "v$VERSION AI" \
            --generate-notes
